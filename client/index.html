<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-right: auto;
        }

        .assistant-message {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-left: auto;
        }

        .chat-controls {
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .mic-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .mic-button.recording {
            background: #ef4444;
            border-color: #dc2626;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
        }

        .audio-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 20px;
        }

        .audio-wave span {
            width: 3px;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            animation: wave 1.2s infinite ease-in-out;
        }

        .audio-wave span:nth-child(2) { animation-delay: 0.1s; }
        .audio-wave span:nth-child(3) { animation-delay: 0.2s; }
        .audio-wave span:nth-child(4) { animation-delay: 0.3s; }
        .audio-wave span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 40%, 100% { transform: scaleY(0.4); }
            20% { transform: scaleY(1); }
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1 class="text-lg font-medium">Voice Assistant</h1>
            <button id="close-btn" class="close-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
            <span id="session-status">Connecting...</span>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="chat-messages">
            <div class="message assistant-message">
                Hello! I'm your voice assistant. Click the microphone to start talking.
            </div>
        </div>

        <!-- Audio Indicator -->
        <div id="audio-indicator" class="hidden" style="padding: 1rem; text-align: center;">
            <div class="audio-wave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="chat-controls">
            <button id="mic-button" class="mic-button">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Audio Client Script -->
    <script src="audio-client.js"></script>

    <script>
        // Audio client initialization
        const audioClient = new AudioClient('ws://localhost:8765/ws');
        let isRecording = false;

        // DOM elements
        const micButton = document.getElementById('mic-button');
        const chatMessages = document.getElementById('chat-messages');
        const audioIndicator = document.getElementById('audio-indicator');
        const sessionStatus = document.getElementById('session-status');
        const closeBtn = document.getElementById('close-btn');

        // Close button handler
        closeBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            }
            audioClient.close();
            sessionStatus.textContent = 'Disconnected';
            document.body.style.display = 'none';
        });

        // Microphone button handler
        micButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Initialize audio client
        async function initializeAudioClient() {
            try {
                sessionStatus.textContent = 'Connecting...';
                await audioClient.connect();

                // Response tracking
                let currentResponseText = '';
                let currentResponseElement = null;

                // Event handlers
                audioClient.onReady = () => {
                    console.log('Audio client ready');
                    sessionStatus.textContent = 'Connected';
                };

                audioClient.onSessionIdReceived = (sessionId) => {
                    console.log('Session ID:', sessionId);
                    sessionStatus.textContent = `Session: ${sessionId.substring(0, 8)}...`;
                };

                audioClient.onAudioReceived = (audioData) => {
                    audioIndicator.classList.remove('hidden');
                };

                audioClient.onTextReceived = (text, sender) => {
                    if (text && text.trim()) {
                        if (!currentResponseElement || !document.body.contains(currentResponseElement) || currentResponseElement.dataset.sender !== sender) {
                            currentResponseText = text;
                            currentResponseElement = addMessage(text, sender);
                            currentResponseElement.dataset.sender = sender;
                        } else {
                            currentResponseText += ' ' + text.trim();
                            currentResponseElement.innerHTML = currentResponseText.replace(/\n/g, '<br>');
                        }
                        scrollToBottom();
                    }
                };



                audioClient.onTurnComplete = () => {
                    audioIndicator.classList.add('hidden');
                    currentResponseText = '';
                    currentResponseElement = null;
                };

                audioClient.onError = (error) => {
                    console.error('Audio client error:', error);
                    addMessage("Sorry, I encountered an error. Please try again.", "assistant");
                    sessionStatus.textContent = 'Error - Try reconnecting';
                    currentResponseText = '';
                    currentResponseElement = null;
                };

                audioClient.onInterrupted = () => {
                    console.log('Interruption detected');
                    audioIndicator.classList.add('hidden');
                    audioClient.interrupt();
                    currentResponseText = '';
                    currentResponseElement = null;
                };

            } catch (error) {
                console.error('Failed to initialize audio client:', error);
                addMessage("Connection failed. Please refresh and try again.", "assistant");
                sessionStatus.textContent = 'Connection failed';
            }
        }

        // Start recording
        async function startRecording() {
            try {
                const success = await audioClient.startRecording();
                if (success) {
                    isRecording = true;
                    micButton.classList.add('recording');
                    addMessage("Listening...", "user");
                }
            } catch (error) {
                console.error('Error starting recording:', error);
            }
        }

        // Stop recording
        function stopRecording() {
            audioClient.stopRecording();
            isRecording = false;
            micButton.classList.remove('recording');

            // Remove temporary "Listening..." message
            const tempMessages = document.querySelectorAll('.user-message');
            if (tempMessages.length > 0) {
                const lastMessage = tempMessages[tempMessages.length - 1];
                if (lastMessage.textContent === 'Listening...') {
                    lastMessage.remove();
                }
            }
        }

        // Add message to chat
        function addMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}-message`;
            messageElement.innerHTML = text.replace(/\n/g, '<br>');
            chatMessages.appendChild(messageElement);
            scrollToBottom();
            return messageElement;
        }

        // Scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initializeAudioClient();
        });
    </script>
</body>
</html>
