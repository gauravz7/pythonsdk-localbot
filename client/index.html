<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark Gray */
            color: #F9FAFB; /* Almost White */
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid #374151; /* Darker Gray */
            text-align: center;
        }
        .session-display {
            padding: 0.5rem;
            background-color: #1F2937; /* Even Darker Gray */
            text-align: center;
            font-family: monospace;
            color: #9CA3AF; /* Muted Gray */
            min-height: 32px;
        }
        .session-active {
            color: #FBBF24; /* Amber */
        }
        .chat-messages {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .chat-message {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 1.25rem;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .user-message {
            background-color: #2563EB; /* Blue */
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .assistant-message {
            background-color: #4B5563; /* Gray */
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .system-message {
            text-align: center;
            color: #F87171; /* Red */
            font-style: italic;
            margin: 0.5rem 0;
        }
        .chat-footer {
            padding: 1.5rem;
            border-top: 1px solid #374151;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #4B5563;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .mic-button:hover {
            background-color: #6B7280;
        }
        .mic-active {
            background-color: #EF4444; /* Red */
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="text-xl font-semibold">Voice Assistant</h1>
        </div>
        <div id="session-display" class="session-display">
            <span>Waiting for session...</span>
        </div>
        <div id="chat-messages" class="chat-messages">
            <div class="chat-message assistant-message">
                Hello! Press the microphone button to start speaking.
            </div>
        </div>
        <div class="chat-footer">
            <div id="mic-button" class="mic-button">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </div>
        </div>
    </div>

    <script src="audio-client.js"></script>
    <script>
        const audioClient = new AudioClient('ws://localhost:8765');
        let isRecording = false;

        const micButton = document.getElementById('mic-button');
        const chatMessages = document.getElementById('chat-messages');
        const sessionDisplay = document.getElementById('session-display');

        micButton.addEventListener('click', () => {
            if (isRecording) {
                audioClient.stopRecording();
            } else {
                audioClient.startRecording();
            }
        });

        function addMessage(text, sender, type = 'chat') {
            const messageElement = document.createElement('div');
            if (type === 'interruption') {
                messageElement.className = 'system-message';
                messageElement.textContent = `--- ${text} ---`;
            } else {
                messageElement.className = `chat-message ${sender}-message`;
                messageElement.textContent = text;
            }
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function initializeAudioClient() {
            try {
                await audioClient.connect();
            } catch (error) {
                console.error('Failed to initialize audio client:', error);
                addMessage("Error: Could not connect to the server.", "assistant");
            }
        }

        // Event Handlers for AudioClient
        audioClient.onReady = () => {
            console.log('Audio client ready');
            isRecording = false;
            micButton.classList.remove('mic-active');
        };

        audioClient.onRecordingStart = () => {
            console.log('Recording started');
            isRecording = true;
            micButton.classList.add('mic-active');
        };

        audioClient.onRecordingStop = () => {
            console.log('Recording stopped');
            isRecording = false;
            micButton.classList.remove('mic-active');
        };

        audioClient.onSessionIdReceived = (sessionId) => {
            console.log('Session ID received:', sessionId);
            sessionDisplay.innerHTML = `<span>Session ID: ${sessionId}</span>`;
            sessionDisplay.classList.add('session-active');
        };

        audioClient.onTextReceived = (text, isUser) => {
            if (text) {
                addMessage(text, isUser ? 'user' : 'assistant');
            }
        };

        audioClient.onInterrupted = () => {
            console.log('Interruption detected');
            addMessage('Response interrupted', 'system', 'interruption');
        };

        audioClient.onError = (error) => {
            console.error('Audio client error:', error);
            addMessage(`Error: ${error.message || 'An unknown error occurred.'}`, 'assistant');
            isRecording = false;
            micButton.classList.remove('mic-active');
        };

        window.addEventListener('load', initializeAudioClient);
    </script>
</body>
</html>
